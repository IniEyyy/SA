<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - Jomoro Koffee</title>
  <meta name="description" content="Jomoro Koffee admin panel for managing products and orders." />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="admin.html" class="navbar-brand">Jomoro <span>Admin</span></a>
      <ul class="navbar-links">
        <li><a href="menu.html">View Menu</a></li>
        <li><a href="#" onclick="logout()" style="color:var(--clr-muted)">Sign Out</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <div class="page-header">
      <h1 class="page-title">Admin <span>Panel</span></h1>
      <p style="color:var(--clr-muted);margin-top:6px">Manage products and inventory.</p>
    </div>

    <div id="tab-products">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h2 style="font-size:1.1rem;font-weight:700">All Products</h2>
        <button class="btn btn-primary" onclick="openCreateModal()">+ Add Product</button>
      </div>
      <table class="table">
        <thead>
          <tr>
            <th>ID</th><th>Name</th><th>Price</th><th>Stock</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="admin-products-body">
          <tr><td colspan="5"><div class="spinner"></div></td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <div id="product-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <span id="product-modal-title" class="modal-title">Add Product</span>
        <button class="modal-close" onclick="closeModal('product-modal')">&times;</button>
      </div>

      <div id="product-modal-alert" class="alert alert-error" style="display:none"></div>

      <form id="product-form" onsubmit="saveProduct(event)">
        <input type="hidden" id="product-id" />

        <div class="form-group">
          <label class="form-label" for="p-name">Name</label>
          <input id="p-name" class="form-control" type="text" placeholder="At least 3 words" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="p-description">Description</label>
          <textarea id="p-description" class="form-control" rows="2" placeholder="At least 20 characters" required></textarea>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div class="form-group">
            <label class="form-label" for="p-price">Price (integer, min 1)</label>
            <input id="p-price" class="form-control" type="number" step="1" min="1" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="p-stock">Stock (0-999)</label>
            <input id="p-stock" class="form-control" type="number" step="1" min="0" max="999" required />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="p-category">Category</label>
          <select id="p-category" class="form-control form-select" required></select>
        </div>
        <div class="form-group">
          <label class="form-label" for="p-imageUrl">Image URL (optional)</label>
          <input id="p-imageUrl" class="form-control" type="text" />
        </div>
        <div style="display:flex;gap:12px;margin-top:8px">
          <button type="submit" class="btn btn-primary" style="flex:1">Save Product</button>
          <button type="button" class="btn btn-outline" onclick="closeModal('product-modal')">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
